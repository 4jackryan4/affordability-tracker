name: Update data

on:
  schedule:
    # Every day at 9:47 a.m. Eastern (13:47 UTC during daylight time).
    # BLS releases CPI and average prices at 8:30 a.m. ET; EIA posts gas and
    # diesel Monday evenings; Freddie Mac posts mortgage rates Thursday at noon.
    - cron: "47 13 * * *"
    # Second pass on Thursday afternoons to catch the Freddie Mac release.
    - cron: "17 17 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit if anything changed
        run: |
          # Stage first: `git diff` alone ignores brand-new (untracked) files,
          # which made the very first run look like it had nothing to save.
          git add data/
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name "affordability-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
